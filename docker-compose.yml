services:
  mongo:
    image: mongo:7
    container_name: awdf-p11-mongo
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    networks:
      - task-network
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: awdf-p11-backend
    restart: unless-stopped
    environment:
      PORT: 5000
      MONGODB_URI: mongodb://mongo:27017/taskmanagement
      JWT_SECRET: ${JWT_SECRET:-p11-development-secret-change-me}
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "5000:5000"
    networks:
      - task-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api
    container_name: awdf-p11-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "5173:80"
    networks:
      - task-network

networks:
  task-network:
    driver: bridge

volumes:
  mongo_data:
